version: 1
backend:
  phases:
    build:
      commands:
        # Node 20 LTS (image Amplify) pour l'outillage ampx / CDK
        - nvm use 20 || nvm install 20
        - npm ci --cache .npm --prefer-offline
        # Déploiement du backend Amplify Gen 2 (Cognito + Data + Storage)
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
