version: 1
# Déploiement FRONTEND SEUL : Amplify Hosting build et publie le site React.
# L'application tourne en mode local (login + gestion BET dans le navigateur).
# Le backend Amplify Gen 2 (Cognito + Data + S3) sera réactivé plus tard en
# rétablissant une section `backend:` une fois le rôle IAM de service configuré.
frontend:
  phases:
    preBuild:
      commands:
        # Node 20 LTS (image Amplify) pour l'outillage
        - nvm use 20 || nvm install 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
